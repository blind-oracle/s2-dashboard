; PlatformIO Project Configuration File
;
; s2-dashboard - LiveWire S2 CAN statistics logger for the Waveshare ESP32-S3-Zero.
;
;   pio run                 build the firmware
;   pio run -t upload       flash over the board's USB-C (native USB, hold BOOT
;                           while plugging in if the port is not detected)
;   pio device monitor      watch the serial log (USB CDC, baud rate irrelevant)
;   pio test -e native      run the host-side decoder unit tests
;   pio run -t menuconfig   change pins / logging / UDS options (S2 Dashboard menu)

[platformio]
default_envs = waveshare_esp32_s3_zero

[env:waveshare_esp32_s3_zero]
; Pinned to an exact version on purpose: a bare "espressif32" resolves to
; whichever installed platform has the highest version number, which is not
; reproducible. 7.1.3 is the official PlatformIO platform and brings ESP-IDF
; 6.1.0.
;
; This was previously the pioarduino fork, pinned for ESP-IDF 5.5.1, back when
; the official platform had gone stale. It is maintained again and now ships a
; newer ESP-IDF than the fork's stable line, so the fork - and the two build
; workarounds it needed - are gone. Previous value, for reference:
;   https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-1/platform-espressif32.zip
platform = espressif32@7.1.3
; The official platform does not ship this board, so the manifest lives in the
; project's own boards/ directory, which PlatformIO reads first.
board = waveshare_esp32_s3_zero
framework = espidf
; Two app slots so the firmware can update itself over the air, 1700 KB each,
; which fits 4 MB with 540 KB spare. THIS is the line that selects the flashed
; table: the platform's espidf builder reads board_build.partitions and ignores
; CONFIG_PARTITION_TABLE_CUSTOM_FILENAME, taking only PARTITION_TABLE_OFFSET
; from sdkconfig. The matching Kconfig option is set in sdkconfig.defaults so
; menuconfig agrees with reality; changing only that would do nothing.
board_build.partitions = partitions_two_ota_large.csv
; USB CDC console: baud rate is irrelevant; keep DTR/RTS low so opening the
; monitor does not reset the chip through the USB Serial/JTAG auto-reset logic.
monitor_speed = 115200
monitor_filters = direct
monitor_dtr = 0
monitor_rts = 0
; Project-only warnings (build_flags would recompile all of ESP-IDF with them).
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
test_ignore = *

; Host-side unit tests for the pure-C decoding core (no ESP-IDF dependency).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<gen/s2_dbc_gen.c>
    +<dbc_decode.c>
    +<e2e.c>
    +<ble_proto.c>
    +<vehicle_button.c>
    +<display/gfx.c>
    +<display/screens.c>
    +<gen/s2_font5x7.c>
build_flags =
    -std=gnu11
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-9
    -Wall
    -Wextra
    -Iinclude
    -Isrc/gen
    -Isrc
    -Isrc/display
    -Itest
